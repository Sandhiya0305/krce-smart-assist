spring.application.name=krce-mobile-backend
server.port=8080

spring.datasource.url=jdbc:sqlite:krce.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

krce.site.url=https://www.krce.ac.in/
krce.scraper.max-pages=30
krce.scraper.timeout-ms=15000
krce.scraper.user-agent=KRCE-Mobile-College-Assistant/1.0
krce.scraper.refresh-minutes=5
